[workspace]
members = ["crates/bat-dsp", "crates/bat-app", "crates/bat-app-web", "crates/x8-patch", "crates/guano"]
resolver = "3"

[workspace.dependencies]
# The AudioMoth chime decoder lives in the Oversample repository, which also uses it. To build
# against a local checkout of Oversample instead, see README ("Building").
chime = { git = "https://github.com/pengowray/oversample", rev = "31dd8e3d59e5a4a73d20400591f0e62d73b6fc8b" }

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

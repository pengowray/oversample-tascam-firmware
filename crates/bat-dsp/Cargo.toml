[package]
name = "bat-dsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Real-time bat detector DSP for microcontrollers: heterodyne, frequency division, time expansion, pitch shift, spectrogram and call detection. no_std, f32, no allocation."

[dependencies]
libm = "0.2.16"
microfft = { version = "0.6.0", default-features = false, features = ["size-1024"] }

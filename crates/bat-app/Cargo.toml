[package]
name = "bat-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The X8 bat app: listening modes, call detection and its 320x480 screen, no_std. Runs on the recorder or in the web emulator."

[dependencies]
bat-dsp = { path = "../bat-dsp" }
chime = { workspace = true }
embedded-graphics = "0.8.2"
u8g2-fonts = "0.8.0"
libm = "0.2.16"
guano = { path = "../guano" }

[dev-dependencies]
# The chime encoder, for the tests' chimes.
chime = { workspace = true, features = ["std"] }
# Check the phone page's QR code in `qr.rs` against a QR encoder, and read it back from the screen.
qrcodegen = "1.8"
rqrr = { version = "0.11", default-features = false }
# For the examples only (screenshot.rs, calls.rs, library.rs, hop_compare.rs, auto_volume.rs, bench.rs).
hound = "3.5"
png = "0.17"
rubato = "5.0"
serde_json = "1.0"

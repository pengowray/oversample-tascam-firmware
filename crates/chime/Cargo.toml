[package]
name = "chime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Decoder for the AudioMoth chime, a data-over-sound format that sets a device clock from a phone. no_std, no allocation."
publish = false

[dependencies]
bat-dsp = { path = "../bat-dsp" }
libm = "0.2.16"

[dev-dependencies]
hound = "3.5"

# Cargo skips the unit tests inside examples unless asked. The bext parser in
# decode_wav.rs has unit tests that "cargo test -p chime" must run.
[[example]]
name = "decode_wav"
test = true

[package]
name = "bat-app-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WebAssembly wrapper that runs bat-app in the browser emulator (web/)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bat-app = { path = "../bat-app" }
# Pinned to the installed wasm-bindgen CLI, which web/build.sh runs.
wasm-bindgen = "=0.2.127"
